<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        header { background: #1e293b; color: #fff; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
        .topbar h1 { font-size: 22px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #1d4ed8; }
        .btn-light { background: #e2e8f0; color: #1e293b; }
        .btn-light:hover { background: #cbd5e1; }
        .box { background: #fff; max-width: 420px; margin: 60px auto; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .box h2 { margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .message { margin-top: 12px; font-weight: bold; color: #dc2626; }
        .section { margin-top: 30px; }
        .section h2 { margin-bottom: 12px; }
        .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #e2e8f0; text-align: left; padding: 10px; font-size: 14px; }
        td { padding: 10px; border-top: 1px solid #e2e8f0; font-size: 14px; vertical-align: top; }
        .empty { text-align: center; color: #64748b; padding: 20px; }
        .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
        footer { height: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="container topbar">
            <h1>ShopEase Admin</h1>
            <button type="button" class="btn btn-light" id="logout-btn" hidden>Logout</button>
        </div>
    </header>

    <!-- Admin login (jab login na ho) -->
    <div class="box" id="login-box">
        <h2>Admin Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="admin-password">Admin Password</label>
                <input type="password" id="admin-password" placeholder="Enter admin password">
            </div>
            <button type="submit" class="btn">Login</button>
            <p class="message" id="login-message"></p>
        </form>
    </div>

    <!-- Admin panel (jab login ho) -->
    <div class="container" id="panel" hidden>
        <div class="toolbar">
            <button type="button" class="btn" id="refresh-btn">Refresh</button>
            <span id="status"></span>
        </div>

        <div class="section">
            <h2>Orders (<span id="orders-count">0</span>)</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Items</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>Contact Messages (<span id="messages-count">0</span>)</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="messages-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer></footer>

    <script>
        // Admin token sirf is tab mein rehta hai (tab band to logout)
        let adminToken = sessionStorage.getItem("shopEaseAdminToken") || "";

        function getElement(id) {
            return document.getElementById(id);
        }

        function formatPrice(price) {
            return "Rs. " + Number(price).toLocaleString("en-PK", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(value) {
            return new Date(value).toLocaleString("en-PK");
        }

        // Table ka ek cell banao (textContent se, taake koi code na chal sake)
        function makeCell(text) {
            const td = document.createElement("td");
            td.textContent = text;
            return td;
        }

        function makeEmptyRow(columns, text) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = columns;
            td.className = "empty";
            td.textContent = text;
            tr.append(td);
            return tr;
        }

        function showPanel() {
            const loggedIn = adminToken !== "";
            getElement("login-box").hidden = loggedIn;
            getElement("panel").hidden = !loggedIn;
            getElement("logout-btn").hidden = !loggedIn;

            if (loggedIn) {
                loadData();
            }
        }

        function logout() {
            adminToken = "";
            sessionStorage.removeItem("shopEaseAdminToken");
            showPanel();
        }

        // Admin token ke sath data mangwao
        function fetchAdmin(url) {
            return fetch(url, {
                headers: { "Authorization": "Bearer " + adminToken }
            }).then(response => {
                if (response.status === 401) {
                    logout();
                    throw new Error("login");
                }
                return response.json();
            });
        }

        function renderOrders(orders) {
            const body = getElement("orders-body");
            body.replaceChildren();
            getElement("orders-count").textContent = orders.length;

            if (orders.length === 0) {
                body.append(makeEmptyRow(7, "Abhi koi order nahi aaya."));
                return;
            }

            orders.forEach(order => {
                const tr = document.createElement("tr");
                const itemsText = order.items
                    .map(item => item.name + " x " + item.quantity)
                    .join(", ");

                tr.append(
                    makeCell(order.orderNumber),
                    makeCell(formatDate(order.date)),
                    makeCell(order.customerName || "-"),
                    makeCell(order.phone || "-"),
                    makeCell(order.address || "-"),
                    makeCell(itemsText),
                    makeCell(formatPrice(order.total))
                );
                body.append(tr);
            });
        }

        function renderMessages(messages) {
            const body = getElement("messages-body");
            body.replaceChildren();
            getElement("messages-count").textContent = messages.length;

            if (messages.length === 0) {
                body.append(makeEmptyRow(4, "Abhi koi message nahi aaya."));
                return;
            }

            messages.forEach(msg => {
                const tr = document.createElement("tr");
                tr.append(
                    makeCell(formatDate(msg.date)),
                    makeCell(msg.name),
                    makeCell(msg.email),
                    makeCell(msg.message)
                );
                body.append(tr);
            });
        }

        function loadData() {
            const status = getElement("status");
            status.textContent = "Loading...";

            Promise.all([fetchAdmin("/admin/orders"), fetchAdmin("/admin/messages")])
                .then(results => {
                    renderOrders(results[0]);
                    renderMessages(results[1]);
                    status.textContent = "";
                })
                .catch(error => {
                    if (error.message === "login") {
                        getElement("login-message").textContent = "Dobara login karo.";
                    } else {
                        status.textContent = "Data nahi aaya. Server chalu hai?";
                    }
                });
        }

        getElement("login-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const password = getElement("admin-password").value;
            const message = getElement("login-message");

            if (!password) {
                message.textContent = "Password likho.";
                return;
            }

            fetch("/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: password })
            })
                .then(response => response.json())
                .then(data => {
                    if (!data.token) {
                        message.textContent = data.message;
                        return;
                    }
                    message.textContent = "";
                    getElement("admin-password").value = "";
                    adminToken = data.token;
                    sessionStorage.setItem("shopEaseAdminToken", adminToken);
                    showPanel();
                })
                .catch(() => {
                    message.textContent = "Server se connection nahi hua. Server chalu karo.";
                });
        });

        getElement("logout-btn").addEventListener("click", logout);
        getElement("refresh-btn").addEventListener("click", loadData);

        showPanel();
    </script>
</body>
</html>
